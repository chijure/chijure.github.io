<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — chijure</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem;
      font-family: system-ui, sans-serif; background: #f6f8f7; color: #14201b; }
    @media (prefers-color-scheme: dark) { body { background: #090d0c; color: #e8f1ed; } a { color: #39ff88 !important; } }
    main { max-width: 32rem; }
    h1 { font-size: 2.2rem; margin: 0 0 .5rem; }
    a { color: #0a7a3f; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p lang="es">La página que buscas no existe o cambió de lugar. <a href="/es/">Ir al inicio</a></p>
    <p lang="en">The page you are looking for does not exist or has moved. <a href="/en/">Go home</a></p>
  </main>
</body>
</html>
